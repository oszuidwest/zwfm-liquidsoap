---
name: zwfm-liquidsoap
services:
  liquidsoap:
    image: ghcr.io/oszuidwest/zwfm-liquidsoap:2.4.6-next
    container_name: liquidsoap
    volumes:
      - ./scripts:/scripts
      - ./audio:/audio
      - ./stereotool:/var/cache/liquidsoap/
      - ./socket:/tmp/liquidsoap # Server socket
    environment:
      - TZ=${CONTAINER_TIMEZONE:-Europe/Amsterdam}
      # Keep listener ports aligned with port mappings when the shell overrides .env.
      - SRT_PORT_PRIMARY=${SRT_PORT_PRIMARY:-8888}
      - SRT_PORT_SECONDARY=${SRT_PORT_SECONDARY:-9999}
      - HTTP_PORT=${HTTP_PORT:-7000}
    env_file:
      - .env
    ports:
      # HTTP API (status and stream metadata)
      - target: ${HTTP_PORT:-7000}
        published: ${HTTP_PORT:-7000}
        host_ip: ${HTTP_BIND:-127.0.0.1}
        protocol: tcp
      # SRT Input 1
      - target: ${SRT_PORT_PRIMARY:-8888}
        published: ${SRT_PORT_PRIMARY:-8888}
        host_ip: ${SRT_BIND:-0.0.0.0}
        protocol: udp
      # SRT Input 2
      - target: ${SRT_PORT_SECONDARY:-9999}
        published: ${SRT_PORT_SECONDARY:-9999}
        host_ip: ${SRT_BIND:-0.0.0.0}
        protocol: udp
      # StereoTool GUI
      - target: 8080
        published: ${STEREOTOOL_WEB_PORT:-8080}
        host_ip: ${STEREOTOOL_WEB_BIND:-0.0.0.0}
        protocol: tcp
    command: /scripts/radio.liq
    restart: unless-stopped
    user: "liquidsoap:liquidsoap"
    # Isolate HLS writes from host disk capacity and permissions.
    tmpfs:
      - /hls:size=64m,uid=100,gid=101,mode=0755
